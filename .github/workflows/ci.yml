name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            go.sum
            mail-engine/go.sum
            mcp/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Product tests and vet
        run: go test ./... && go vet ./...
      - name: Mail-engine tests and vet
        working-directory: mail-engine
        run: go test ./... && go vet ./...
      - name: MCP tests and vet
        working-directory: mcp
        run: go test ./... && go vet ./...
      - name: Dashboard tests and production build
        working-directory: dashboard
        run: npm ci && npm test && npm run typecheck && npm run build
      - name: Static Linux binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o /tmp/lullmail .
      - name: Production container
        run: docker build -t lullmail:ci .

  # Real PostgreSQL so the engine's store integration suite runs instead of
  # skipping: a green build must not silently exclude every database test
  # (audit 3 OPS-07). Race runs on all three modules share the service.
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mailtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d mailtest"
          --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            go.sum
            mail-engine/go.sum
            mcp/go.sum
      - name: Engine store integration and race checks
        working-directory: mail-engine
        env:
          NEUTRON_MAIL_TEST_DATABASE_URL: postgres://test:test@localhost:5432/mailtest?sslmode=disable
        run: go test -race -count=1 ./...
      - name: Product integration and race checks
        env:
          LULL_TEST_DATABASE_URL: postgres://test:test@localhost:5432/mailtest?sslmode=disable
        run: go test -race -count=1 ./...
      - name: MCP race checks
        working-directory: mcp
        run: go test -race -count=1 ./...

  # Synthetic pointer/keyboard acceptance only: the fixture contains no
  # account credentials and intercepts every API request in the browser.
  # Kept separate so a unit-only run cannot be mistaken for native UI QA.
  dashboard-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard test dependencies
        working-directory: dashboard
        run: npm ci
      - name: Install test Chromium
        working-directory: dashboard
        run: npx playwright install --with-deps chromium
      - name: Synthetic selection browser acceptance
        working-directory: dashboard
        env:
          E2E_OUTPUT: ${{ runner.temp }}/lullmail-selection-browser
        run: |
          mkdir -p "$E2E_OUTPUT"
          npm run test:selection 2>&1 | tee "$E2E_OUTPUT/selection.log"
      - name: Preserve selection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lullmail-selection-browser
          path: ${{ runner.temp }}/lullmail-selection-browser
          if-no-files-found: ignore

  # Real-Chromium acceptance for every documented keyboard shortcut. Same
  # contract as dashboard-selection: the real app against a synthetic API,
  # every request intercepted, no credentials.
  dashboard-keybinds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard test dependencies
        working-directory: dashboard
        run: npm ci
      - name: Install test Chromium
        working-directory: dashboard
        run: npx playwright install --with-deps chromium
      - name: Synthetic keybind browser acceptance
        working-directory: dashboard
        env:
          E2E_OUTPUT: ${{ runner.temp }}/lullmail-keybinds-browser
        run: |
          mkdir -p "$E2E_OUTPUT"
          npm run test:keybinds 2>&1 | tee "$E2E_OUTPUT/keybinds.log"
      - name: Preserve keybind evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lullmail-keybinds-browser
          path: ${{ runner.temp }}/lullmail-keybinds-browser
          if-no-files-found: ignore

  publish:
    # Real-database integration and race checks gate publication too: a
    # green unit-only build must not be able to publish an image past a
    # failed PostgreSQL job (audit 4 F02).
    needs: [verify, postgres-integration]
    # Only pushes publish. A v* tag on an older commit must never move
    # `latest` backwards (audit OPS-08): main publishes latest, a version
    # tag publishes only its own immutable tags.
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Choose tags without rolling latest back from a historical tag
        id: tags
        shell: bash
        run: |
          image=ghcr.io/lullmail/lullmail
          {
            echo 'value<<EOF'
            echo "$image:${GITHUB_SHA}"
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then
              echo "$image:latest"
            elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "$image:${GITHUB_REF_NAME}"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.value }}
