name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            go.sum
            mail-engine/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Product tests and vet
        run: go test ./... && go vet ./...
      - name: Mail-engine tests and vet
        working-directory: mail-engine
        run: go test ./... && go vet ./...
      - name: Dashboard tests and production build
        working-directory: dashboard
        run: npm ci && npm test && npm run typecheck && npm run build
      - name: Static Linux binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o /tmp/lullmail .
      - name: Production container
        run: docker build -t lullmail:ci .
