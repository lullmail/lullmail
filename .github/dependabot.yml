version: 2
# mail-engine/ is vendored from Neutron mail/ and must stay byte-identical
# (mail-engine/VENDOR.md), so its dependencies are bumped there, not here.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /mcp
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
    ignore:
      # Neutron core and cli peer on preact ^10; Preact 11 waits for them.
      - dependency-name: preact
        update-types: ["version-update:semver-major"]
