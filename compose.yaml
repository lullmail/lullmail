# Self-host with no configuration. This file is all you need — it runs the
# published image, so there is nothing to clone or build:
#
#   curl -fsSLO https://raw.githubusercontent.com/lullmail/lullmail/main/compose.yaml
#   docker compose up -d
#   docker compose logs app        <- one-time setup link (valid 24h)
#
# Open the link, pick a name and password, done. To upgrade later:
#
#   docker compose pull && docker compose up -d
#
# Pin a release by setting LULL_VERSION (e.g. LULL_VERSION=v0.2.0); the
# default follows the latest build of main. To build from a checkout instead
# of pulling: docker compose -f compose.yaml -f compose.build.yaml up -d --build
#
# SECRET_KEY and the setup token are generated on first boot and kept in the
# appdata volume. Every env var below is optional and overrides the generated
# value — see the README env table.
services:
  app:
    image: ghcr.io/lullmail/lullmail:${LULL_VERSION:-latest}
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://lull:lull@db:5432/lull?sslmode=disable
      SECRET_KEY: ${SECRET_KEY:-}
      LULL_TOKEN: ${LULL_TOKEN:-}
      LULL_USER_EMAIL: ${LULL_USER_EMAIL:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
    volumes:
      - appdata:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: lull
      POSTGRES_USER: lull
      POSTGRES_PASSWORD: lull
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lull"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

volumes:
  appdata:
  pgdata:
