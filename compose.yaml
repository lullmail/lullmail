# Self-host with no configuration:
#   docker compose up -d
#   docker compose logs app        <- one-time setup token (valid 24h)
#   open http://localhost:8080     <- paste token, create your passkey, done
#
# SECRET_KEY and the setup token are generated on first boot and kept in the
# appdata volume. Every env var below is optional and overrides the generated
# value — see the README env table.
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://emailsoft:emailsoft@db:5432/emailsoft?sslmode=disable
      SECRET_KEY: ${SECRET_KEY:-}
      EMAILSOFT_TOKEN: ${EMAILSOFT_TOKEN:-}
      EMAILSOFT_USER_EMAIL: ${EMAILSOFT_USER_EMAIL:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
    volumes:
      - appdata:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: emailsoft
      POSTGRES_USER: emailsoft
      POSTGRES_PASSWORD: emailsoft
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emailsoft"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

volumes:
  appdata:
  pgdata:
